[package]
name = "agent-browser-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local Chrome profile lifecycle and session-owned MCP browser tools"
license = "MIT"

[[bin]]
name = "abm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
toml = "0.9"

[package]
name = "agent-browser-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local Chrome profile lifecycle and session-owned MCP browser tools"
repository = "https://github.com/ozankasikci/agent-browser-manager"
license = "MIT"

[[bin]]
name = "abm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
age = { version = "0.11", default-features = false }
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
libc = "0.2"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tar = "0.4"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
toml = "0.9"
